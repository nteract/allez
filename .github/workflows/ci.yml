name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test --all (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            ubuntu-latest,
            ubuntu-24.04-arm,
            macos-latest,
            windows-latest,
            windows-11-arm,
          ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all --locked --features test-config-override

  doc:
    name: cargo doc (allez, condarc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: make doc

  deny:
    name: cargo deny check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  coverage:
    name: cargo llvm-cov (fail-under-lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      # 85% is a fixed floor set against this branch's own current baseline
      # (94.89% line coverage measured locally pre-GEN-24), not a "no
      # decrease from the previous commit" diff -- see T005/tasks.md for
      # why a floor is this task's deliberate, documented simplification.
      # Revisit this number at T056/T058 once the full `ephemeral/` module
      # (including its Windows-only/`#[cfg(windows)]` paths this Linux job
      # can't itself exercise) has landed and real coverage is measured.
      - run: cargo llvm-cov --all --locked --fail-under-lines 85 --features test-config-override

  conformance:
    name: condarc conformance tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: false
          conda-version: "26.5.3"
          python-version: "3.12"
      - shell: bash -l {0}
        run: |
          touch tests/condarc_conformance.rs
          cargo test --test condarc_conformance --features conformance-tests --locked -- --nocapture

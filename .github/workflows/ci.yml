name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test --all (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all --locked

  cross-compile-check:
    name: cargo check --target aarch64-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - run: cargo check --locked --target aarch64-unknown-linux-gnu

  conformance:
    name: condarc conformance tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: false
          conda-version: "26.5.3"
          python-version: "3.12"
      - shell: bash -l {0}
        run: |
          touch tests/condarc_conformance.rs
          cargo test --test condarc_conformance --features conformance-tests --locked -- --nocapture

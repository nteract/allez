[workspace]
members = [".", "crates/condarc"]

[package]
name = "allez"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
condarc = { path = "crates/condarc" }
dirs = "6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "json", "env-filter"] }

# GEN-24 (ephemeral environment core): native rattler ecosystem for
# repodata fetching, solving, and checksum-verified install/link -- see
# specs/GEN-24_ephemeral_env_core/research.md for the full rationale.
rattler = "0.48.0"
rattler_conda_types = "0.49.0"
rattler_repodata_gateway = { version = "0.31.0", features = ["gateway"] }
rattler_solve = "8.0.0"
rattler_cache = "0.10.4"
rattler_digest = "1.3.2"
rattler_virtual_packages = "4.0.0"
rattler_shell = "0.27.11"
ulid = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "process", "signal", "time"] }
# Pinned to the major version `rattler_networking` (a transitive dependency
# of `rattler`, via `astral-reqwest-middleware`/`ambient-id`) itself
# resolves to -- confirmed via `cargo tree -i reqwest` to be 0.13, not 0.12,
# since `Installer::with_download_client`/`Gateway::with_client` require an
# identical `reqwest` major version across the whole graph. 0.13's TLS
# feature is named `rustls` (renamed from 0.12's `rustls-tls`) and pulls in
# `aws-lc-rs` (ISC-licensed) by default -- see T004/`deny.toml`.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# `fs` + `process` features: `paths.rs`/`permissions.rs`/`cleanup.rs` call
# `rustix::fs::mkdirat` directly for handle-anchored directory creation and
# `rustix::process::geteuid()` for current-user ownership checks.
rustix = { version = "1", features = ["fs", "process"] }
[target.'cfg(windows)'.dependencies]
# "Win32_System_Threading": `permissions.rs`'s owner-only verification of a
# *reused* root/cache directory needs `GetCurrentProcess`/`OpenProcessToken`
# (both declared under this module by `windows-sys`, despite being
# security- rather than threading-related) to compare that directory's
# owner SID against the current user's own.
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

# Gates the `condarc_conformance` integration test (see the `[[test]]` entry
# below). It's off by default so a plain `cargo test --all` -- the normal
# local developer/unit-test workflow -- never even compiles or runs it: the
# conformance suite shells out to a real conda oracle and is comparatively
# slow, so it's treated like a separate integration-test tier rather than a
# unit test. Enable it explicitly with `--features conformance-tests` (the
# `make conformance*` targets and the CI conformance job both do this).
#
# `network-tests` gates the one ephemeral-env integration test (T061) that
# requires real network access (the FR-015 `defaults`-channel fallback,
# resolved end-to-end); off by default for the same reason.
[features]
conformance-tests = []
network-tests = []
# Gates a test-only `ALLEZ_CONDARC_PATH` environment-variable check in
# `channel_config::default_condarc_path()` (see
# specs/GEN-25_oneshot_command/research.md § Test strategy), plus a
# test-only `ephemeral::test_create_owner_only_directory` seam
# `tests/oneshot_exec.rs`'s Windows harness uses to pre-create an
# already-owner-only `ALLEZ_EPHEMERAL_ROOT` for its root-reuse scenarios.
# Not part of any `default = [...]` list -- there is none in this
# `Cargo.toml` today -- so a release build has no code path that reads
# that env var, or exposes that seam, at all.
test-config-override = []

# Explicit target so `required-features` can gate it; cargo's test
# autodiscovery still picks up every other file under tests/ (e.g.
# cli_scaffold.rs) normally.
[[test]]
name = "condarc_conformance"
path = "tests/condarc_conformance.rs"
required-features = ["conformance-tests"]

# Gated the same way as `condarc_conformance` above, but for a different
# reason: `test-config-override` exists for the `ALLEZ_CONDARC_PATH`
# security concern (research.md), not test speed -- see Makefile's `test`
# target and .github/workflows/ci.yml's `test`/`coverage` jobs, both of
# which pass `--features test-config-override` on their default invocation.
[[test]]
name = "oneshot_exec"
path = "tests/oneshot_exec.rs"
required-features = ["test-config-override"]

[dev-dependencies]
assert_cmd = "2.2.2"
jsonschema = { version = "0.48.5", default-features = false }
predicates = "3.1.4"
rstest = "0.26.1"
serial_test = "3"
tempfile = "3.14.0"

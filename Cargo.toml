[package]
name = "allez"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "json", "env-filter"] }

[dev-dependencies]
assert_cmd = "2.2.2"
jsonschema = { version = "0.48.5", default-features = false }
predicates = "3.1.4"
rstest = "0.26.1"
tempfile = "3.14.0"
